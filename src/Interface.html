<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      font-size: 13px;
      color: #202124;
      background: #fff;
    }

    .header {
      background: #1a73e8;
      color: #fff;
      padding: 14px 16px;
    }
    .header h2 { font-size: 15px; font-weight: 600; }
    .header p  { font-size: 11px; opacity: .8; margin-top: 2px; }

    .section {
      padding: 14px 16px;
      border-bottom: 1px solid #e0e0e0;
    }

    label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      color: #5f6368;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 5px;
    }

    input[type="url"] {
      width: 100%;
      padding: 7px 9px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-size: 12px;
      outline: none;
      color: #202124;
    }
    input[type="url"]:focus { border-color: #1a73e8; }

    .hint {
      font-size: 11px;
      color: #5f6368;
      margin-top: 5px;
    }

    .use-current {
      margin-top: 8px;
      background: none;
      border: 1px solid #dadce0;
      border-radius: 4px;
      padding: 5px 10px;
      font-size: 11px;
      color: #1a73e8;
      cursor: pointer;
      width: 100%;
    }
    .use-current:hover { background: #e8f0fe; }

    .actions {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    button {
      padding: 9px 14px;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      width: 100%;
      transition: filter .15s;
    }
    button:hover:not(:disabled) { filter: brightness(.93); }
    button:disabled { opacity: .5; cursor: not-allowed; }

    .btn-blue   { background: #1a73e8; color: #fff; }
    .btn-grey   { background: #f1f3f4; color: #202124; }
    .btn-green  { background: #34a853; color: #fff; }
    .btn-reset  { background: #f1f3f4; color: #5f6368; }

    .status-area { padding: 12px 16px; }

    .status {
      padding: 10px 12px;
      border-radius: 4px;
      font-size: 12px;
      line-height: 1.6;
      display: none;
      word-break: break-word;
    }
    .status.info    { background: #e8f0fe; color: #1558d6; display: block; }
    .status.success { background: #e6f4ea; color: #137333; display: block; }
    .status.error   { background: #fce8e6; color: #c5221f; display: block; }

    .spinner {
      display: inline-block;
      width: 11px; height: 11px;
      border: 2px solid rgba(0,0,0,.15);
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin-right: 5px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .divider {
      border: none;
      border-top: 1px solid #e0e0e0;
      margin: 0;
    }
  </style>
</head>
<body>

  <div class="header">
    <h2>Extrator de Metadados</h2>
    <p>TRE-PR &mdash; Archivematica</p>
  </div>

  <div class="section">
    <label>Planilha de referência</label>
    <input type="url" id="spreadsheetUrl"
           placeholder="https://docs.google.com/spreadsheets/d/...">
    <p class="hint">A pasta que contém esta planilha será escaneada.</p>
    <button class="use-current" onclick="useCurrentSheet()">
      ↩ Usar esta planilha
    </button>
  </div>

  <div class="actions">
    <button class="btn-blue" onclick="startListing()">
      📁&nbsp; Listar documentos
    </button>
    <button class="btn-grey" onclick="startDescription()">
      🤖&nbsp; Descrever com IA
    </button>
    <hr class="divider">
    <button class="btn-green" onclick="exportCsv()">
      📥&nbsp; Exportar CSV (Archivematica)
    </button>
    <button class="btn-reset" onclick="resetCheckpointUI()">
      🔄&nbsp; Reiniciar checkpoint
    </button>
  </div>

  <div class="status-area">
    <div id="status" class="status"></div>
  </div>

  <script>
    function setStatus(msg, type) {
      const el = document.getElementById("status");
      el.className = "status " + type;
      el.innerHTML = msg;
    }

    function setBusy(msg) {
      setStatus('<span class="spinner"></span>' + msg, "info");
      document.querySelectorAll("button").forEach(b => b.disabled = true);
    }

    function setIdle() {
      document.querySelectorAll("button").forEach(b => b.disabled = false);
    }

    function useCurrentSheet() {
      google.script.run
        .withSuccessHandler(url => {
          document.getElementById("spreadsheetUrl").value = url;
        })
        .withFailureHandler(err => setStatus("❌ " + err.message, "error"))
        .getCurrentSpreadsheetUrl();
    }

    function startListing() {
      const url = document.getElementById("spreadsheetUrl").value.trim();
      if (!url) { setStatus("Cole o link de uma planilha do Google.", "error"); return; }
      setBusy("Listando documentos...");
      google.script.run
        .withSuccessHandler(result => { setIdle(); setStatus("✅ " + result, "success"); })
        .withFailureHandler(err  => { setIdle(); setStatus("❌ " + err.message, "error"); })
        .runListing(url);
    }

    function startDescription() {
      setBusy("Descrevendo com IA — isso pode levar alguns minutos...");
      google.script.run
        .withSuccessHandler(result => { setIdle(); setStatus("✅ " + result, "success"); })
        .withFailureHandler(err  => { setIdle(); setStatus("❌ " + err.message, "error"); })
        .runDescription();
    }

    function exportCsv() {
      setBusy("Gerando metadata.csv...");
      google.script.run
        .withSuccessHandler(fileUrl => {
          setIdle();
          setStatus(
            '✅ CSV gerado com sucesso.<br><a href="' + fileUrl + '" target="_blank">Abrir metadata.csv</a>',
            "success"
          );
        })
        .withFailureHandler(err => { setIdle(); setStatus("❌ " + err.message, "error"); })
        .exportCsvForArchivematica();
    }

    function resetCheckpointUI() {
      google.script.run
        .withSuccessHandler(() => setStatus("✅ Checkpoint reiniciado. A próxima listagem começará do início.", "success"))
        .withFailureHandler(err => setStatus("❌ " + err.message, "error"))
        .resetCheckpoint();
    }
  </script>

</body>
</html>
